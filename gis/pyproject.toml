[project]
name = "circuitforge-gis"
version = "0.1.0"
description = "GIS processing for CircuitForge AI (OSM road graph work starts in Issue #6)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime GIS libraries (OSMnx, NetworkX, ...) are added in Issue #6 once needed.
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
